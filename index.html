<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SuperFly · TWA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #0b111e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', monospace;
            touch-action: none;
            margin: 0;
            padding: 8px;
        }
        .game-wrapper {
            background: #1a1f2e;
            padding: 14px 14px 20px;
            border-radius: 32px;
            box-shadow: 0 10px 0 #0b0e16, 0 8px 24px rgba(0,0,0,0.8);
            width: 100%;
            max-width: 820px;
        }
        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 18px;
            background: #87CEEB;
            box-shadow: inset 0 0 0 3px #2d3a4a, 0 0 0 4px #0f141f;
            width: 100%;
            height: auto;
            aspect-ratio: 800 / 500;
            touch-action: none;
            cursor: crosshair;
        }
        .ui-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            color: #b8d0e0;
            text-shadow: 0 2px 0 #0a0e14;
            font-weight: 700;
            font-size: 1.2rem;
            padding: 0 4px;
            flex-wrap: wrap;
            gap: 8px 12px;
        }
        .score-box {
            background: #0f1622;
            padding: 4px 20px;
            border-radius: 40px;
            border-bottom: 4px solid #3f5a70;
            letter-spacing: 1.5px;
            color: #f5d742;
            box-shadow: inset 0 -2px 0 #2a3b4a;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .enemy-counter {
            background: #1f2a3a;
            padding: 4px 18px;
            border-radius: 40px;
            border-bottom: 4px solid #4a2a2a;
            color: #ff8a7a;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .restart-btn {
            background: #2d3f54;
            border: none;
            border-bottom: 4px solid #151f2b;
            color: #eaf2f9;
            font-weight: bold;
            font-size: 1.1rem;
            padding: 4px 22px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.06s ease;
            font-family: 'Courier New', monospace;
            letter-spacing: 0.5px;
            box-shadow: 0 3px 0 #0b1119;
            touch-action: manipulation;
        }
        .restart-btn:active {
            transform: translateY(4px);
            border-bottom-width: 0px;
        }
        .hint {
            color: #7b94aa;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            padding-right: 2px;
        }
        @media (max-width: 480px) {
            .ui-panel {
                font-size: 0.95rem;
                justify-content: center;
            }
            .score-box, .enemy-counter {
                padding: 2px 14px;
                font-size: 1rem;
            }
            .restart-btn {
                font-size: 0.95rem;
                padding: 2px 18px;
            }
        }
    </style>
</head>
<body>
<div class="game-wrapper">
    <canvas id="gameCanvas" width="800" height="500"></canvas>
    <div class="ui-panel">
        <span class="score-box">⭐ <span id="scoreDisplay">0</span></span>
        <span class="enemy-counter">👾 <span id="enemyCountDisplay">1</span></span>
        <span class="hint">🪰 мышь / палец</span>
        <button class="restart-btn" id="restartButton">↺ старт</button>
    </div>
</div>
<script>
    (function() {
        // ---------- НАСТРОЙКИ ----------
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreSpan = document.getElementById('scoreDisplay');
        const enemyCountSpan = document.getElementById('enemyCountDisplay');

        const W = 800, H = 500;

        // Игровое состояние
        let gameActive = false;
        let score = 0;
        let frameId = null;

        // Параметры усложнения
        const ENEMY_SPAWN_SCORE_INTERVAL = 10;
        let enemySpawnThreshold = ENEMY_SPAWN_SCORE_INTERVAL;

        // ------ Эффекты ------
        let particleEffects = [];

        // ------ Игрок (муха) ------
        const fly = {
            x: 200, y: 200,
            r: 14,
            speed: 4.6,
            vx: 0, vy: 0,
            targetX: 200, targetY: 200,
            wingAngle: 0,
            wingSpeed: 0.25,
            eyeAngle: 0,
        };

        // ------ Враги (массив) ------
        let enemies = [];

        const ENEMY_BASE = {
            r: 16,
            speed: 1.9,
            chaseRadius: 280,
            idleSpeed: 0.6,
        };

        // ------ Бонусы (звёзды) ------
        let bonuses = [];
        const BONUS_RADIUS = 11;
        const MAX_BONUSES = 9;
        const SPAWN_COOLDOWN = 26;
        let spawnTimer = 0;

        // ------ Вспомогательные функции ------
        function updateUI() {
            scoreSpan.textContent = score;
            enemyCountSpan.textContent = enemies.length;
        }

        // Проверка перекрытия с другими врагами
        function isOverlappingWithEnemies(x, y, radius, ignoreIndex = -1) {
            for (let i = 0; i < enemies.length; i++) {
                if (i === ignoreIndex) continue;
                const e = enemies[i];
                const dist = Math.hypot(x - e.x, y - e.y);
                if (dist < radius + e.r + 6) return true;
            }
            return false;
        }

        // Проверка перекрытия с другими бонусами
        function isOverlappingWithBonuses(x, y, radius, ignoreIndex = -1) {
            for (let i = 0; i < bonuses.length; i++) {
                if (i === ignoreIndex) continue;
                const b = bonuses[i];
                const dist = Math.hypot(x - b.x, y - b.y);
                if (dist < radius + b.r + 8) return true;
            }
            return false;
        }

        // Создать врага в безопасной позиции
        function createEnemy(avoidX, avoidY, avoidRadius = 120) {
            let attempts = 0;
            let x, y, valid;
            const padding = 35;
            do {
                x = padding + Math.random() * (W - 2 * padding);
                y = padding + Math.random() * (H - 2 * padding);
                const dx = x - avoidX;
                const dy = y - avoidY;
                const dist = Math.hypot(dx, dy);
                valid = dist > avoidRadius;
                if (valid) {
                    if (isOverlappingWithEnemies(x, y, ENEMY_BASE.r)) {
                        valid = false;
                    }
                }
                attempts++;
                if (attempts > 150) break;
            } while (!valid);

            return {
                x, y,
                r: ENEMY_BASE.r,
                speed: ENEMY_BASE.speed + (enemies.length * 0.04),
                chaseRadius: ENEMY_BASE.chaseRadius,
                idleSpeed: ENEMY_BASE.idleSpeed + (enemies.length * 0.02),
                vx: (Math.random() - 0.5) * 0.8,
                vy: (Math.random() - 0.5) * 0.8,
                idleTimer: 0,
                targetAngle: Math.random() * Math.PI * 2,
                eyeAngle: 0,
            };
        }

        // Проверка и добавление новых врагов
        function checkAndSpawnEnemy() {
            if (!gameActive) return;
            if (score >= enemySpawnThreshold) {
                if (enemies.length < 10) {
                    const newEnemy = createEnemy(fly.x, fly.y, 140);
                    if (!isOverlappingWithEnemies(newEnemy.x, newEnemy.y, newEnemy.r)) {
                        enemies.push(newEnemy);
                    } else {
                        const retry = createEnemy(fly.x, fly.y, 160);
                        if (!isOverlappingWithEnemies(retry.x, retry.y, retry.r)) {
                            enemies.push(retry);
                        }
                    }
                }
                enemySpawnThreshold += ENEMY_SPAWN_SCORE_INTERVAL;
                updateUI();
            }
        }

        // ------ Создание эффекта сбора звезды (уменьшенная дальность, увеличенный размер) ------
        function createCollectEffect(x, y) {
            const count = 20;
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 0.8 + Math.random() * 1.8; // Уменьшена дальность
                const color = ['#ffd700', '#ffec8b', '#ffb347', '#ff8c00', '#fff4a0'][Math.floor(Math.random() * 5)];
                particleEffects.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 0.3,
                    radius: 2.5 + Math.random() * 3.5, // Увеличен размер
                    life: 1.0,
                    decay: 0.015 + Math.random() * 0.018,
                    color: color,
                    gravity: 0.04,
                });
            }
            // Искры
            for (let i = 0; i < 10; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 1.0 + Math.random() * 2.5;
                particleEffects.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 0.5,
                    radius: 1.5 + Math.random() * 2.0,
                    life: 1.0,
                    decay: 0.025 + Math.random() * 0.02,
                    color: '#ffffff',
                    gravity: 0.06,
                });
            }
        }

        // ------ Сброс игры ------
        function resetGame() {
            if (frameId) {
                cancelAnimationFrame(frameId);
                frameId = null;
            }

            gameActive = true;
            score = 0;
            enemySpawnThreshold = ENEMY_SPAWN_SCORE_INTERVAL;
            particleEffects = [];

            fly.x = 200; fly.y = 200;
            fly.vx = 0; fly.vy = 0;
            fly.targetX = 200; fly.targetY = 200;
            fly.wingAngle = 0;
            fly.eyeAngle = 0;

            enemies = [];
            const firstEnemy = createEnemy(fly.x, fly.y, 160);
            enemies.push(firstEnemy);

            bonuses = [];
            spawnTimer = 0;

            updateUI();
            gameLoop();
        }

        // ------ Спавн бонуса (звезды) ------
        function spawnBonus() {
            if (!gameActive) return;
            if (bonuses.length >= MAX_BONUSES) return;

            const padding = 30;
            let x, y, valid;
            let attempts = 0;
            do {
                x = padding + Math.random() * (W - 2 * padding);
                y = padding + Math.random() * (H - 2 * padding);
                valid = true;
                
                if (Math.hypot(x - fly.x, y - fly.y) < 50) valid = false;
                
                for (const e of enemies) {
                    if (Math.hypot(x - e.x, y - e.y) < 50) { valid = false; break; }
                }
                
                if (valid) {
                    if (isOverlappingWithBonuses(x, y, BONUS_RADIUS)) {
                        valid = false;
                    }
                }
                
                attempts++;
                if (attempts > 80) break;
            } while (!valid);

            if (valid) {
                bonuses.push({ x, y, r: BONUS_RADIUS });
            }
        }

        // ------ Обновление ------
        function update() {
            if (!gameActive) return;

            // 0. Анимация крыльев
            fly.wingAngle += fly.wingSpeed;
            if (fly.wingAngle > Math.PI * 2) fly.wingAngle -= Math.PI * 2;

            // Обновляем угол глаз игрока (на курсор)
            const dxToTarget = fly.targetX - fly.x;
            const dyToTarget = fly.targetY - fly.y;
            fly.eyeAngle = Math.atan2(dyToTarget, dxToTarget);

            // 1. Муха к цели
            const dx = fly.targetX - fly.x;
            const dy = fly.targetY - fly.y;
            const dist = Math.hypot(dx, dy);

            if (dist > 0.5) {
                const accel = 0.19;
                fly.vx += dx * accel;
                fly.vy += dy * accel;
                const spd = Math.hypot(fly.vx, fly.vy);
                const maxSpd = fly.speed;
                if (spd > maxSpd) {
                    fly.vx = (fly.vx / spd) * maxSpd;
                    fly.vy = (fly.vy / spd) * maxSpd;
                }
            } else {
                fly.vx *= 0.92;
                fly.vy *= 0.92;
                if (Math.abs(fly.vx) < 0.02) fly.vx = 0;
                if (Math.abs(fly.vy) < 0.02) fly.vy = 0;
            }

            fly.x += fly.vx;
            fly.y += fly.vy;

            const r = fly.r;
            if (fly.x - r < 0) { fly.x = r; fly.vx *= -0.3; }
            if (fly.x + r > W) { fly.x = W - r; fly.vx *= -0.3; }
            if (fly.y - r < 0) { fly.y = r; fly.vy *= -0.3; }
            if (fly.y + r > H) { fly.y = H - r; fly.vy *= -0.3; }

            // 2. Враги
            for (let i = 0; i < enemies.length; i++) {
                const enemy = enemies[i];
                const dxE = fly.x - enemy.x;
                const dyE = fly.y - enemy.y;
                const distToPlayer = Math.hypot(dxE, dyE);

                // Обновляем угол глаз врага (на игрока)
                enemy.eyeAngle = Math.atan2(dyE, dxE);

                const isChasing = distToPlayer < enemy.chaseRadius && gameActive;

                if (isChasing) {
                    if (distToPlayer > 0.5) {
                        const accel = 0.07;
                        enemy.vx += dxE * accel;
                        enemy.vy += dyE * accel;
                        const spd = Math.hypot(enemy.vx, enemy.vy);
                        const maxSpd = enemy.speed || ENEMY_BASE.speed;
                        if (spd > maxSpd) {
                            enemy.vx = (enemy.vx / spd) * maxSpd;
                            enemy.vy = (enemy.vy / spd) * maxSpd;
                        }
                    } else {
                        enemy.vx *= 0.9;
                        enemy.vy *= 0.9;
                    }
                } else {
                    // Блуждание
                    enemy.idleTimer = (enemy.idleTimer || 0) + 1;
                    if (enemy.idleTimer > 60 + Math.random() * 80) {
                        enemy.idleTimer = 0;
                        enemy.targetAngle = Math.random() * Math.PI * 2;
                    }

                    const idleSpeed = enemy.idleSpeed || ENEMY_BASE.idleSpeed;
                    const currentAngle = Math.atan2(enemy.vy, enemy.vx);
                    let angleDiff = enemy.targetAngle - currentAngle;
                    while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                    while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
                    const turnSpeed = 0.04;
                    const newAngle = currentAngle + Math.sign(angleDiff) * Math.min(Math.abs(angleDiff), turnSpeed);

                    enemy.vx = Math.cos(newAngle) * idleSpeed;
                    enemy.vy = Math.sin(newAngle) * idleSpeed;

                    const distFromCenter = Math.hypot(enemy.x - W/2, enemy.y - H/2);
                    if (distFromCenter > 300) {
                        const toCenter = Math.atan2(H/2 - enemy.y, W/2 - enemy.x);
                        enemy.targetAngle = toCenter;
                        enemy.idleTimer = 70;
                    }
                }

                enemy.x += enemy.vx;
                enemy.y += enemy.vy;

                const er = enemy.r;
                if (enemy.x - er < 0) { enemy.x = er; enemy.vx *= -0.5; enemy.targetAngle = Math.atan2(enemy.vy, -enemy.vx); }
                if (enemy.x + er > W) { enemy.x = W - er; enemy.vx *= -0.5; enemy.targetAngle = Math.atan2(enemy.vy, -enemy.vx); }
                if (enemy.y - er < 0) { enemy.y = er; enemy.vy *= -0.5; enemy.targetAngle = Math.atan2(-enemy.vy, enemy.vx); }
                if (enemy.y + er > H) { enemy.y = H - er; enemy.vy *= -0.5; enemy.targetAngle = Math.atan2(-enemy.vy, enemy.vx); }
            }

            // 3. Разрешение коллизий между врагами
            for (let i = 0; i < enemies.length; i++) {
                for (let j = i + 1; j < enemies.length; j++) {
                    const a = enemies[i];
                    const b = enemies[j];
                    const dx = a.x - b.x;
                    const dy = a.y - b.y;
                    const dist = Math.hypot(dx, dy);
                    const minDist = a.r + b.r + 4;
                    if (dist < minDist && dist > 0.001) {
                        const overlap = (minDist - dist) / 2;
                        const nx = dx / dist;
                        const ny = dy / dist;
                        a.x += nx * overlap;
                        a.y += ny * overlap;
                        b.x -= nx * overlap;
                        b.y -= ny * overlap;
                        const tempVx = a.vx;
                        const tempVy = a.vy;
                        a.vx = b.vx * 0.6 + (Math.random() - 0.5) * 0.3;
                        a.vy = b.vy * 0.6 + (Math.random() - 0.5) * 0.3;
                        b.vx = tempVx * 0.6 + (Math.random() - 0.5) * 0.3;
                        b.vy = tempVy * 0.6 + (Math.random() - 0.5) * 0.3;
                        a.idleTimer = 50;
                        b.idleTimer = 50;
                        a.targetAngle = Math.atan2(a.vy, a.vx);
                        b.targetAngle = Math.atan2(b.vy, b.vx);
                    }
                }
            }

            // 4. Коллизия муха + враг → GAME OVER
            for (const enemy of enemies) {
                const d = Math.hypot(fly.x - enemy.x, fly.y - enemy.y);
                if (d < fly.r + enemy.r - 3) {
                    gameActive = false;
                    return;
                }
            }

            // 5. Сбор бонусов
            for (let i = bonuses.length - 1; i >= 0; i--) {
                const b = bonuses[i];
                if (Math.hypot(fly.x - b.x, fly.y - b.y) < fly.r + b.r - 2) {
                    createCollectEffect(b.x, b.y);
                    score++;
                    updateUI();
                    bonuses.splice(i, 1);
                    checkAndSpawnEnemy();
                }
            }

            // 6. Обновление частиц
            for (let i = particleEffects.length - 1; i >= 0; i--) {
                const p = particleEffects[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += p.gravity || 0.05;
                p.life -= p.decay;
                p.radius *= 0.998;
                if (p.life <= 0 || p.radius < 0.2) {
                    particleEffects.splice(i, 1);
                }
            }

            // 7. Спавн бонусов
            if (gameActive) {
                spawnTimer++;
                if (spawnTimer >= SPAWN_COOLDOWN) {
                    spawnTimer = 0;
                    spawnBonus();
                }
                if (bonuses.length < 4 && Math.random() < 0.02) spawnBonus();
            }
        }

        // ------ Отрисовка ------
        function draw() {
            ctx.clearRect(0, 0, W, H);

            const grad = ctx.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, '#a6d8f0');
            grad.addColorStop(0.6, '#8fc4e0');
            grad.addColorStop(1, '#b0d0e8');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);

            // облака
            ctx.fillStyle = 'rgba(255,255,245,0.18)';
            ctx.beginPath();
            ctx.arc(100, 70, 45, 0, Math.PI*2);
            ctx.arc(150, 90, 35, 0, Math.PI*2);
            ctx.arc(60, 110, 30, 0, Math.PI*2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(600, 120, 50, 0, Math.PI*2);
            ctx.arc(660, 100, 40, 0, Math.PI*2);
            ctx.arc(560, 140, 30, 0, Math.PI*2);
            ctx.fill();

            // бонусы (звёзды)
            for (const b of bonuses) {
                ctx.shadowColor = '#f5e56b';
                ctx.shadowBlur = 22;
                const gradB = ctx.createRadialGradient(b.x-3, b.y-3, 2, b.x, b.y, b.r+4);
                gradB.addColorStop(0, '#fcee8f');
                gradB.addColorStop(0.7, '#e8b83a');
                gradB.addColorStop(1, '#b87c1a');
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
                ctx.fillStyle = gradB;
                ctx.fill();
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.arc(b.x-3, b.y-4, 4, 0, Math.PI*2);
                ctx.fillStyle = '#fffbe6';
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = '#dba53f';
                ctx.lineWidth = 1.8;
                ctx.stroke();
            }

            // эффекты частиц
            for (const p of particleEffects) {
                const alpha = p.life;
                ctx.globalAlpha = alpha;
                ctx.shadowBlur = 12;
                ctx.shadowColor = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
                ctx.shadowBlur = 0;
            }
            ctx.globalAlpha = 1.0;

            // враги (с глазами, смотрящими на игрока)
            for (const enemy of enemies) {
                ctx.shadowColor = '#d03030';
                ctx.shadowBlur = 28;
                const gradE = ctx.createRadialGradient(enemy.x-5, enemy.y-6, 5, enemy.x, enemy.y, enemy.r+6);
                gradE.addColorStop(0, '#e05a5a');
                gradE.addColorStop(0.7, '#b12a2a');
                gradE.addColorStop(1, '#611515');
                ctx.beginPath();
                ctx.arc(enemy.x, enemy.y, enemy.r, 0, Math.PI*2);
                ctx.fillStyle = gradE;
                ctx.fill();
                
                // Глаза врага
                ctx.shadowBlur = 8;
                const eyeOffsetX = Math.cos(enemy.eyeAngle || 0) * 5;
                const eyeOffsetY = Math.sin(enemy.eyeAngle || 0) * 5;
                
                // Левый глаз (белок)
                ctx.fillStyle = '#f0f4fa';
                ctx.beginPath();
                ctx.arc(enemy.x-7 + eyeOffsetX * 0.3, enemy.y-5 + eyeOffsetY * 0.3, 6, 0, Math.PI*2);
                ctx.fill();
                
                // Правый глаз (белок)
                ctx.beginPath();
                ctx.arc(enemy.x+7 + eyeOffsetX * 0.3, enemy.y-5 + eyeOffsetY * 0.3, 6, 0, Math.PI*2);
                ctx.fill();
                
                // Зрачки
                ctx.fillStyle = '#1c222e';
                const leftPupilX = enemy.x-7 + eyeOffsetX * 0.6;
                const leftPupilY = enemy.y-5 + eyeOffsetY * 0.6;
                const rightPupilX = enemy.x+7 + eyeOffsetX * 0.6;
                const rightPupilY = enemy.y-5 + eyeOffsetY * 0.6;
                
                ctx.beginPath();
                ctx.arc(leftPupilX, leftPupilY, 3.2, 0, Math.PI*2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(rightPupilX, rightPupilY, 3.2, 0, Math.PI*2);
                ctx.fill();
                
                // Блики
                ctx.fillStyle = '#f5f9ff';
                ctx.beginPath();
                ctx.arc(leftPupilX - 1.5, leftPupilY - 2, 1.5, 0, Math.PI*2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(rightPupilX - 1.5, rightPupilY - 2, 1.5, 0, Math.PI*2);
                ctx.fill();
            }

            // ------ ИГРОК (муха с глазами, смотрящими на курсор) ------
            const wingPhase = Math.sin(fly.wingAngle);
            const wingAngle = wingPhase * 0.6;
            
            ctx.shadowColor = '#3f9eff';
            ctx.shadowBlur = 28;
            const gradF = ctx.createRadialGradient(fly.x-4, fly.y-5, 4, fly.x, fly.y, fly.r+5);
            gradF.addColorStop(0, '#a3d0ff');
            gradF.addColorStop(0.6, '#3b8cff');
            gradF.addColorStop(1, '#0e4b9e');
            ctx.beginPath();
            ctx.arc(fly.x, fly.y, fly.r, 0, Math.PI*2);
            ctx.fillStyle = gradF;
            ctx.fill();

            // Крылья
            ctx.save();
            ctx.translate(fly.x - 8, fly.y - 6);
            ctx.rotate(wingAngle * 0.8);
            ctx.shadowBlur = 18;
            ctx.shadowColor = 'rgba(180, 220, 255, 0.5)';
            ctx.beginPath();
            ctx.ellipse(0, 0, 14, 6, 0, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(200, 240, 255, 0.55)';
            ctx.fill();
            ctx.strokeStyle = 'rgba(180, 220, 255, 0.7)';
            ctx.lineWidth = 1.5;
            ctx.stroke();
            ctx.restore();

            ctx.save();
            ctx.translate(fly.x + 8, fly.y - 6);
            ctx.rotate(-wingAngle * 0.8);
            ctx.shadowBlur = 18;
            ctx.shadowColor = 'rgba(180, 220, 255, 0.5)';
            ctx.beginPath();
            ctx.ellipse(0, 0, 14, 6, 0, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(200, 240, 255, 0.55)';
            ctx.fill();
            ctx.strokeStyle = 'rgba(180, 220, 255, 0.7)';
            ctx.lineWidth = 1.5;
            ctx.stroke();
            ctx.restore();

            // Глаза игрока (смотрят на курсор)
            ctx.shadowBlur = 6;
            ctx.shadowColor = 'rgba(0,0,0,0.2)';
            
            // Белки глаз
            const eyeAngle = fly.eyeAngle || 0;
            const eyeOffX = Math.cos(eyeAngle) * 4;
            const eyeOffY = Math.sin(eyeAngle) * 4;
            
            ctx.fillStyle = '#f2faff';
            // Левый глаз
            ctx.beginPath();
            ctx.arc(fly.x-7 + eyeOffX * 0.2, fly.y-4 + eyeOffY * 0.2, 6, 0, Math.PI*2);
            ctx.fill();
            // Правый глаз
            ctx.beginPath();
            ctx.arc(fly.x+7 + eyeOffX * 0.2, fly.y-4 + eyeOffY * 0.2, 6, 0, Math.PI*2);
            ctx.fill();
            
            // Зрачки (направлены на курсор)
            ctx.fillStyle = '#111a2e';
            const pupilOff = 3.5;
            ctx.beginPath();
            ctx.arc(fly.x-7 + eyeOffX * 0.6, fly.y-4 + eyeOffY * 0.6, 3, 0, Math.PI*2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(fly.x+7 + eyeOffX * 0.6, fly.y-4 + eyeOffY * 0.6, 3, 0, Math.PI*2);
            ctx.fill();
            
            // Блики
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(fly.x-7 + eyeOffX * 0.6 - 1.2, fly.y-4 + eyeOffY * 0.6 - 1.5, 1.2, 0, Math.PI*2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(fly.x+7 + eyeOffX * 0.6 - 1.2, fly.y-4 + eyeOffY * 0.6 - 1.5, 1.2, 0, Math.PI*2);
            ctx.fill();

            // Блик на теле
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.arc(fly.x-3, fly.y-6, 4, 0, Math.PI*2);
            ctx.fillStyle = 'rgba(255,255,255,0.25)';
            ctx.fill();

            // Game Over
            if (!gameActive) {
                ctx.shadowBlur = 28;
                ctx.shadowColor = '#cc2222';
                ctx.font = 'bold 52px "Courier New", monospace';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#f0d0d0';
                ctx.strokeStyle = '#3a0e0e';
                ctx.lineWidth = 6;
                ctx.strokeText('✖ GAME OVER', 400, 220);
                ctx.fillText('✖ GAME OVER', 400, 220);
                ctx.font = '20px monospace';
                ctx.fillStyle = '#eecfaf';
                ctx.fillText('нажми "старт"', 400, 300);
            }

            ctx.shadowBlur = 0;
        }

        // ------ Цикл ------
        function gameLoop() {
            if (!gameActive) {
                draw();
                frameId = null;
                return;
            }
            update();
            draw();
            frameId = requestAnimationFrame(gameLoop);
        }

        // ------ Управление ------
        function handlePointer(x, y) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let cx = (x - rect.left) * scaleX;
            let cy = (y - rect.top) * scaleY;
            cx = Math.min(W - 8, Math.max(8, cx));
            cy = Math.min(H - 8, Math.max(8, cy));
            fly.targetX = cx;
            fly.targetY = cy;
        }

        function onMove(e) {
            e.preventDefault();
            const ev = e.touches ? e.touches[0] : e;
            if (ev) handlePointer(ev.clientX, ev.clientY);
        }

        function onStart(e) {
            e.preventDefault();
            const ev = e.touches ? e.touches[0] : e;
            if (ev) handlePointer(ev.clientX, ev.clientY);
        }

        function initControls() {
            canvas.addEventListener('mousemove', onMove);
            canvas.addEventListener('touchmove', onMove, { passive: false });
            canvas.addEventListener('touchstart', onStart, { passive: false });
            document.body.addEventListener('touchmove', (e) => {
                if (e.target === canvas) e.preventDefault();
            }, { passive: false });
        }

        // ------ Кнопка рестарта ------
        document.getElementById('restartButton').addEventListener('click', resetGame);
        document.getElementById('restartButton').addEventListener('touchstart', (e) => {
            e.preventDefault();
            resetGame();
        });

        // ------ Инициализация ------
        function init() {
            initControls();
            resetGame();
        }

        init();
    })();
</script>
</body>
</html>
